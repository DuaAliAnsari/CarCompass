# Data preparation settings for the PakWheels CSV (Kaggle, muhamedumarjamil, v4)
raw_path: data/raw/pakistan_used_cars.csv
out_dir: data/processed
report_path: reports/data_quality.md
seed: 42
test_size: 0.2

# raw column name -> our column name
column_map:
  nam: name
  Price: price_raw
  Year: year
  Millage: mileage_raw
  Fuel: fuel
  Transmission: transmission
  Province: location
  Color: color
  Assembly: assembly
  Engine Capacity: engine_raw
  Body Type: body_type
  Ad Reference: ad_id

bounds:
  price: [100000, 150000000]     # PKR
  year: [1980, 2026]
  mileage: [0, 500000]           # km
  engine_cc: [500, 8500]         # only checked when present

# Cars older than `min_age_years` with fewer than `min_km` km are treated as typos
low_mileage_rule:
  min_age_years: 5
  min_km: 1000
  reference_year: 2026

multiword_makes: ["Land Rover", "Range Rover", "Mercedes Benz", "Alfa Romeo", "Rolls Royce", "Aston Martin", "Great Wall", "Mini Cooper"]
multiword_models: ["Range Rover", "Land Cruiser", "Mark X", "N Box", "N Wgn", "N One", "Wagon R", "Grand Cherokee", "Grand Vitara", "Santa Fe", "Corolla Axio", "Corolla Fielder", "Corolla Runx", "Corolla Cross", "Yaris Cross", "Civic Reborn", "Hi Ace", "Land Cruiser Prado"]

# Rare categories are grouped as "Other" (counted on the full cleaned data)
min_count_location: 200
min_count_color: 200
# (make, model) pairs with fewer listings are dropped
min_listings_per_model: 5
mlflow_tracking_uri: sqlite:///mlflow.db