# Each entry becomes one MLflow run. Add or change entries to compare more settings.
# At least 3 runs per model type, as the milestone requires.
experiments:
  # Baseline: a "dumb" guess every real model must beat.
  - {name: baseline_median, model: baseline, params: {strategy: median}}
  - {name: baseline_mean, model: baseline, params: {strategy: mean}}
  - {name: baseline_q40, model: baseline, params: {strategy: quantile, quantile: 0.4}}
  # Ridge: one smooth price formula; alpha controls how strongly it is kept simple.
  - {name: ridge_alpha_01, model: ridge, params: {alpha: 0.1}}
  - {name: ridge_alpha_1, model: ridge, params: {alpha: 1.0}}
  - {name: ridge_alpha_10, model: ridge, params: {alpha: 10.0}}
  # Random forest: many decision trees averaged together.
  - {name: rf_100_depth12, model: random_forest, params: {n_estimators: 100, max_depth: 12}}
  - {name: rf_200_depth16, model: random_forest, params: {n_estimators: 200, max_depth: 16}}
  - {name: rf_300_depth20, model: random_forest, params: {n_estimators: 300, max_depth: 20}}
  # LightGBM: trees built one after another, each fixing the last one's mistakes.
  - {name: lgbm_300, model: lightgbm, params: {n_estimators: 300, learning_rate: 0.05}}
  - {name: lgbm_600_lr03, model: lightgbm, params: {n_estimators: 600, learning_rate: 0.03, num_leaves: 63}}
  - {name: lgbm_900_lr02, model: lightgbm, params: {n_estimators: 900, learning_rate: 0.02, num_leaves: 127}}
